<!-- Main dashboard webpage showing SmartSeal status, temperature, alerts, and captured images. -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartSeal+ Monitoring Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- Flask supplies the initial event list; dashboard.js refreshes it later. -->
<h1>SmartSeal Dashboard</h1>

<table border="1">
<thead><tr>
    <th>Time</th>
    <th>Seal ID</th>
    <th>Temp</th>
    <th>Tamper</th>
    <th>Vibration</th>
    <th>Image</th>
    <th>AI analysis</th>
</tr></thead>

<!-- Event rows use SQLite column positions supplied by the Flask route. -->
<tbody id="events">
{% for event in events %}<tr>
    <td>{{ event[1] }}</td><td>{{ event[2] }}</td><td>{{ event[3] }}</td>
    <td>{{ event[4] }}</td><td>{{ event[5] }}</td>
    <td>{% if event[6] %}<a href="{{ url_for('images', filename=event[6]) }}" target="_blank">View</a>{% endif %}</td>
    <td>{{ event[7] or '' }}</td>
</tr>{% endfor %}
</tbody>

</table>

<script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
