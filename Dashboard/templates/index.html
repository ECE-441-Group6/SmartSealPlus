<!DOCTYPE html>
<html>
<head>
    <title>SmartSeal Dashboard</title>
</head>
<body>

<h1>SmartSeal Dashboard</h1>

<table border="1">
<tr>
    <th>Time</th>
    <th>Seal ID</th>
    <th>Temp</th>
    <th>Tamper</th>
    <th>Vibration</th>
</tr>

{% for event in events %}
<tr>
    <td>{{ event[1] }}</td>
    <td>{{ event[2] }}</td>
    <td>{{ event[3] }}</td>
    <td>{{ event[4] }}</td>
    <td>{{ event[5] }}</td>
</tr>
{% endfor %}

</table>

</body>
</html>
